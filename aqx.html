<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>القرماني إكس AQX — المجرّة</title>
<style>
:root{--v:#b9a3f5;--s:#4fc3f7;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;background:#05020f;color:#fff;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
a{color:inherit;text-decoration:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
header{position:fixed;top:0;inset-inline:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(10,5,35,.6);backdrop-filter:blur(14px);border-bottom:1px solid #b9a3f544}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:.1em;text-shadow:0 0 12px #7a4df0,0 0 26px var(--s)}
header small{opacity:.7;flex:1;font-size:.75rem;letter-spacing:.2em}
header a.b{padding:7px 16px;border-radius:20px;background:linear-gradient(135deg,#7a4df0,#4fc3f7);font-weight:700;font-size:.85rem}
#dock{position:fixed;top:calc(54px + env(safe-area-inset-top,0px));inset-inline:0;z-index:4;display:flex;gap:8px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
#dock a{white-space:nowrap;padding:6px 14px;border-radius:18px;border:1px solid #b9a3f566;background:rgba(20,10,60,.55);backdrop-filter:blur(8px);font-size:.82rem}
#dock a:hover{background:#7a4df0}
.lb{position:fixed;left:0;top:0;z-index:3;padding:6px 14px;border-radius:20px;border:1px solid var(--v);background:rgba(20,10,60,.6);backdrop-filter:blur(8px);color:#fff;font:700 .85rem system-ui,sans-serif;cursor:pointer;white-space:nowrap;box-shadow:0 0 14px #7a4df088}
.lb:hover{background:#7a4df0}
#pn{position:fixed;z-index:6;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(380px,90vw);padding:18px;border-radius:22px;background:rgba(20,10,60,.78);backdrop-filter:blur(14px);border:1px solid var(--v);text-align:center;box-shadow:0 0 30px #7a4df0aa}
#pn[hidden]{display:none}#pn b{font-size:1.25rem}
#pn .go{display:inline-block;margin-top:8px;padding:9px 22px;border-radius:24px;background:linear-gradient(135deg,#7a4df0,#4fc3f7);font-weight:700}
#px{position:absolute;top:8px;inset-inline-end:10px;background:none;border:0;color:#fff;font-size:1.1rem;cursor:pointer}
#st{position:fixed;bottom:0;inset-inline:0;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(8,4,28,.75);backdrop-filter:blur(12px)}
.bar{overflow:hidden;white-space:nowrap;border-top:1px solid #b9a3f533}
.tr{display:inline-flex;gap:26px;padding:8px 0;animation:mq 45s linear infinite;--d:50%}
[dir=ltr] .tr{--d:-50%}
@keyframes mq{to{transform:translateX(var(--d))}}
.bar:hover .tr{animation-play-state:paused}
.up{color:#4be08b}.dn{color:#ff6b7a}
.py{padding:5px 14px;border-radius:12px;font-weight:800;font-size:.8rem;color:#fff;box-shadow:0 0 10px #0006,inset 0 0 8px #fff3}
footer{text-align:center;font-size:.72rem;opacity:.75;padding:6px;border-top:1px solid #b9a3f533}
#ht{position:fixed;bottom:calc(122px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;font-size:.78rem;opacity:.65;pointer-events:none;z-index:2}
@media(prefers-reduced-motion:reduce){.tr{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><span class="logo">AQX</span><small>ALQURMANI X · BEYOND THE ORDINARY</small><a class="b" href="signup.html" id="acc">افتح حساب AQX</a></header>
<nav id="dock" aria-label="الأقسام"></nav>
<div id="ht"></div>
<div id="pn" hidden><button id="px" aria-label="إغلاق">✕</button><b id="pt"></b><p id="pd"></p><a class="go" id="pa" href="#">ادخل العالم</a></div>
<div id="st">
  <div class="bar"><div class="tr" id="mk"></div></div>
  <div class="bar"><div class="tr" id="py"></div></div>
  <footer>© <span id="yr"></span> ALQURMANI X AQX — جميع الحقوق محفوظة · AQX Web</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),L=navigator.language||'ar',AR=/^ar/i.test(L),TH=THREE;
document.documentElement.lang=L;
document.documentElement.dir=/^(ar|he|fa|ur)/i.test(L)?'rtl':'ltr';
$('#yr').textContent=new Date().getFullYear();
$('#ht').textContent=AR?'اسحب للدوران · عجلة الماوس للتقريب · اضغط على أي عالم':'Drag to orbit · Scroll to zoom · Tap a world';
$('#acc').textContent=AR?'افتح حساب AQX':'Open AQX account';

/* ===== الأقسام الرئيسية (أيقونة|عربي|English|ملف) ===== */
const S="🏠|الرئيسية|Home|index,📜|سياسات AQX|Policies|policies,⭐|محفوظاتي|Saved|saved,ℹ️|عن AQX|About|about,🌌|منظومتنا|Ecosystem|eco,🧩|منصاتنا|Platforms|platforms,🛎️|خدماتنا|Services|services,🛠️|أدواتنا الرقمية|Tools|tools,🎮|الألعاب والترفيه|Games|games,🏭|مشروعاتنا الواقعية|Projects|projects,🛍️|متجرنا|Store|store,📣|التسويق والإعلانات|Marketing|marketing,💼|الفرص والعمل|Careers|careers,📚|المعرفة والإعلام|Knowledge|knowledge,🤝|الشراكات|Partnerships|partnerships,🆘|مركز المساعدة|Help|help,📞|تواصل معنا|Contact|contact,💜|AQX الخيرية|Charity|charity,🎓|الأكاديمية|Academy|academy,👥|المجتمع|Community|community";
$('#dock').innerHTML=S.split(',').map(x=>{const a=x.split('|');return `<a href="${a[3]}.html">${a[0]} ${AR?a[1]:a[2]}</a>`}).join('');

/* ===== شريط البورصة (قيم تجريبية — اربطها بمصدر أسعار فعلي) ===== */
const MK=[['USD','48.2',1],['EUR','52.1',0],['GBP','61.3',1],['SAR','12.8',1],['ذهب 24','—',1],['ذهب 21','—',0],['ذهب 18','—',1],['أوقية الذهب','—',1],['الفضة','—',0]];
const mk=MK.map(m=>`<a href="market-${encodeURIComponent(m[0])}.html">${m[0]} <b>${m[1]}</b> <span class="${m[2]?'up':'dn'}">${m[2]?'▲':'▼'}</span></a>`).join('');
$('#mk').innerHTML='<span>📈 AQX LIVE MARKET (تجريبي)</span>'+mk+mk+mk;

/* ===== شريط وسائل الدفع (ألوان الجهات؛ استبدلها بالشعارات الرسمية) ===== */
const PY=[['Binance','#F0B90B','#000'],['Vodafone Cash','#E60000'],['Orange Cash','#FF7900'],['Etisalat Cash','#6BB539'],['WE Cash','#5B2D8E'],['Fawry','#FFC400','#000'],['InstaPay','#7B2D8B'],['البريد المصري','#00539B'],['Mashreq Neo','#FF5A1F'],['CIB','#003B7A'],['PayPal','#003087'],['Payoneer','#FF4800'],['WebMoney','#1F5FB5'],['Skrill','#862165'],['Payeer','#2F9FDD'],['Neteller','#83BA3B'],['Bankak','#C8102E']];
const py=PY.map(p=>`<a class="py" href="payments-${p[0].replace(/\W+/g,'').toLowerCase()||'post'}.html" style="background:linear-gradient(135deg,${p[1]},${p[1]}bb);color:${p[2]||'#fff'}">${p[0]}</a>`).join('');
$('#py').innerHTML=py+py;

/* ===== المشهد ثلاثي الأبعاد ===== */
const rd=new TH.WebGLRenderer({canvas:$('#c'),antialias:true});
rd.setPixelRatio(Math.min(devicePixelRatio||1,2));rd.setClearColor(0x05020f);
const sc=new TH.Scene(),cm=new TH.PerspectiveCamera(60,1,.1,3000);
const rz=()=>{rd.setSize(innerWidth,innerHeight,false);cm.aspect=innerWidth/innerHeight;cm.updateProjectionMatrix()};
rz();addEventListener('resize',rz);

/* المجرّة الحلزونية */
const NG=36000,gp=new Float32Array(NG*3),gc=new Float32Array(NG*3);
const c1=new TH.Color(0xffc8ff),c2=new TH.Color(0x4fc3f7),c3=new TH.Color(0x7a4df0);
for(let i=0;i<NG;i++){
  const r=Math.pow(Math.random(),.6)*95,a=(i%3)*2.094+r*.07+(Math.random()-.5)*.6,
  h=(Math.random()-.5)*Math.max(1,8-r*.06)*Math.random(),
  c=c1.clone().lerp(c3,Math.min(r/35,1)).lerp(c2,Math.max(0,Math.min((r-35)/60,1)));
  gp[i*3]=Math.cos(a)*r;gp[i*3+1]=h;gp[i*3+2]=Math.sin(a)*r;
  gc[i*3]=c.r;gc[i*3+1]=c.g;gc[i*3+2]=c.b;
}
const gg=new TH.BufferGeometry();
gg.setAttribute('position',new TH.BufferAttribute(gp,3));
gg.setAttribute('color',new TH.BufferAttribute(gc,3));
const gal=new TH.Points(gg,new TH.PointsMaterial({size:.55,vertexColors:true,transparent:true,blending:TH.AdditiveBlending,depthWrite:false}));
sc.add(gal);

/* نجوم الخلفية */
const NS=1800,sp=new Float32Array(NS*3);
for(let i=0;i<NS*3;i++)sp[i]=(Math.random()-.5)*1500;
const sg=new TH.BufferGeometry();sg.setAttribute('position',new TH.BufferAttribute(sp,3));
sc.add(new TH.Points(sg,new TH.PointsMaterial({size:1.4,color:0xffffff,transparent:true,opacity:.8})));

/* القلب: توهج + شعار AQX تفاعلي */
const tex=f=>{const c=document.createElement('canvas');c.width=512;c.height=256;f(c.getContext('2d'));return new TH.CanvasTexture(c)};
const core=new TH.Sprite(new TH.SpriteMaterial({map:tex(x=>{const g=x.createRadialGradient(256,128,0,256,128,128);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(185,163,245,.7)');g.addColorStop(1,'rgba(79,195,247,0)');x.fillStyle=g;x.fillRect(0,0,512,256)}),blending:TH.AdditiveBlending,depthWrite:false}));
core.scale.set(110,55,1);sc.add(core);
const aq=new TH.Sprite(new TH.SpriteMaterial({map:tex(x=>{x.font='800 150px Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';x.shadowColor='#b9a3f5';x.shadowBlur=30;x.fillStyle='#fff';x.fillText('AQX',256,135)}),transparent:true,depthWrite:false}));
aq.scale.set(26,13,1);sc.add(aq);
sc.add(new TH.AmbientLight(0x8877cc,.5));
sc.add(new TH.PointLight(0xffffff,2.6,260));

/* العوالم الستة (المنظومة) */
const P=[
['💰','المنظومة المالية','Finance','eco-finance.html',0x4fc3f7,22,'الحسابات والمحافظ والمدفوعات','Accounts, wallets & payments'],
['🏥','المنظومة الطبية','Medical','eco-medical.html',0xff7aa8,30,'الخدمات والمنصات الطبية','Medical services & platforms'],
['💻','المنظومة التقنية والرقمية','Tech & Digital','eco-tech.html',0x9a6bff,39,'التكنولوجيا والأدوات والمنصات','Technology, tools & platforms'],
['💼','منظومة الأعمال والخدمات','Business & Services','eco-business.html',0xffc857,48,'خدمات الأفراد والشركات','Services for people & companies'],
['📦','منظومة التجارة والتوريد','Trade & Supply','eco-trade.html',0x5de0a8,57,'المتجر والبيع والشراء والتوريد','Store, trade & supply'],
['🌱','المبادرات والمشروعات','Initiatives','eco-initiatives.html',0xff9f6b,66,'المشروعات الواقعية والمجتمعية','Real-world & community projects']
];
const W=P.map((p,i)=>{
  const m=new TH.Mesh(new TH.SphereGeometry(2.6,32,32),new TH.MeshPhongMaterial({color:p[4],emissive:p[4],emissiveIntensity:.35,shininess:40}));
  sc.add(m);
  m.add(new TH.Mesh(new TH.SphereGeometry(3.7,24,24),new TH.MeshBasicMaterial({color:p[4],transparent:true,opacity:.18,blending:TH.AdditiveBlending,depthWrite:false})));
  const o=new TH.Mesh(new TH.RingGeometry(p[5]-.06,p[5]+.06,160),new TH.MeshBasicMaterial({color:p[4],transparent:true,opacity:.3,side:TH.DoubleSide}));
  o.rotation.x=Math.PI/2;sc.add(o);
  const d=document.createElement('button');d.className='lb';d.textContent=p[0]+' '+(AR?p[1]:p[2]);
  d.onclick=()=>pick(i);document.body.append(d);
  return{m,d,a:i*1.05,s:.35/(1+i*.3)};
});

/* التحكم بالكاميرا */
let yaw=0,pit=.5,dist=420,td=105,drag=0,lx=0,ly=0,foc=-1,pulse=0,t0=performance.now(),last=t0;
const tv=new TH.Vector3(),v3=new TH.Vector3();
addEventListener('pointerdown',e=>{if(e.target.closest('.lb,#pn,header,#dock,#st'))return;drag=1;lx=e.clientX;ly=e.clientY;pulse=1});
addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-lx)*.005;pit=Math.max(-.2,Math.min(1.3,pit+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY}});
addEventListener('pointerup',()=>drag=0);
addEventListener('wheel',e=>{td=Math.max(25,Math.min(190,td+e.deltaY*.08))},{passive:true});
const pick=i=>{
  foc=i;td=20;const p=P[i];
  $('#pt').textContent=p[0]+' '+(AR?p[1]:p[2]);
  $('#pd').textContent=AR?p[6]:p[7];
  $('#pa').href=p[3];$('#pa').textContent=AR?'ادخل العالم':'Enter world';
  $('#pn').hidden=false;
};
$('#px').onclick=()=>{foc=-1;td=105;$('#pn').hidden=true};
addEventListener('keydown',e=>{if(e.key=='Escape')$('#px').click()});

/* الحلقة */
const f=n=>{
  const dt=Math.min((n-last)/1000,.1),el=(n-t0)/1000,intro=el<10;last=n;
  dist+=(td-dist)*(1-Math.exp(-dt*(intro?.45:2.5)));
  if(!drag)yaw+=dt*(intro?.18:.04);
  gal.rotation.y+=dt*.01;pulse*=.95;
  const k=1+.06*Math.sin(el*2)+pulse*.25;
  aq.scale.set(26*k,13*k,1);core.scale.set(110*k,55*k,1);
  W.forEach((w,i)=>{
    w.a+=w.s*dt*.3;const R=P[i][5];
    w.m.position.set(Math.cos(w.a)*R,Math.sin(w.a*2+i)*1.6,Math.sin(w.a)*R);
    w.m.rotation.y+=dt*.5;
    v3.copy(w.m.position).project(cm);
    const on=v3.z<1&&!(foc>=0&&foc!=i);
    w.d.style.display=on?'':'none';
    if(on)w.d.style.transform=`translate(${(v3.x*.5+.5)*innerWidth}px,${(-v3.y*.5+.5)*innerHeight-26}px) translate(-50%,-50%)`;
  });
  tv.lerp(foc>=0?W[foc].m.position:v3.set(0,0,0),1-Math.exp(-dt*3));
  cm.position.set(tv.x+Math.sin(yaw)*Math.cos(pit)*dist,tv.y+Math.sin(pit)*dist,tv.z+Math.cos(yaw)*Math.cos(pit)*dist);
  cm.lookAt(tv);
  rd.render(sc,cm);requestAnimationFrame(f);
};
requestAnimationFrame(f);
</script>
</body>
</html>
