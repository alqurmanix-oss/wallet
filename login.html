<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store">
<title>ربط جلسة حساب AQX بالمحفظة</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#080b12;color:#f5f1e8}
body{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 0,#1d2940,#080b12 58%)}
.panel{width:min(100%,440px);padding:28px;background:#111824;border:1px solid #b99548;border-radius:22px;box-shadow:0 24px 80px #0009;text-align:center}
.brand{color:#d8b65f;font-weight:800;letter-spacing:1px}.lock{font-size:38px;margin:15px}h2{margin:0 0 10px;font-size:20px}
.hint{color:#b8c0cb;font-size:13px;line-height:1.9}.msg{min-height:48px;margin-top:14px;color:#f0c4a8;font-size:13px;line-height:1.8}
a{display:inline-block;margin-top:12px;color:#f0d77e;text-decoration:none}
</style></head>
<body>
<main class="panel" aria-live="polite">
  <div class="brand">AQX UNIVERSAL WALLET</div>
  <div class="lock" aria-hidden="true">✦</div>
  <h2 id="welcome">أهلًا بك في محفظة AQX</h2>
  <p class="hint" id="welcomeText">يسعدنا انضمامك. نهيّئ لك تجربة مالية سهلة وآمنة داخل منظومة AQX.</p>
  <div class="msg" id="message" role="status" aria-live="polite" hidden></div>
</main>
<script src="wallet-security.js"></script>
<script>
const welcome=document.getElementById("welcome");
const welcomeText=document.getElementById("welcomeText");
const message=document.getElementById("message");

function retryable(error){
  return !error.status || error.status===408 || error.status===429 || error.status>=500;
}
async function requestWithRetry(action){
  let lastError;
  for(let attempt=0;attempt<3;attempt++){
    try{return await aqxWalletApi(action);}
    catch(error){
      lastError=error;
      if(!retryable(error)||attempt===2)throw error;
      await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)));
    }
  }
  throw lastError;
}
function returnToDashboard(){
  message.hidden=false;
  message.textContent="نعتذر، تعذّر فتح محفظتك هذه المرة. سنعيدك الآن إلى مركز AQX، ويمكنك المحاولة مجددًا.";
  window.setTimeout(()=>location.replace("https://id.alqurmanix.com/dashboard-aqx.html"),2200);
}
async function init(){
 try{
  const p=await requestWithRetry("profile");
  if(!p.wallet_exists||p.wallet_status!=="active")throw new Error("wallet_unavailable");
  if(!p.email_verified)throw new Error("email_not_verified");
  if(!p.phone_verified)throw new Error("phone_not_verified");

  if(!p.password_set){
    welcome.textContent="أهلًا بك في محفظة AQX";
    welcomeText.textContent="يسعدنا أن تكون هذه بدايتك معنا. سنساعدك على إعداد محفظتك لتستمتع بخدمات AQX بسهولة وأمان.";
    location.replace("setup.html");
    return;
  }

  welcome.textContent="مرحبًا بعودتك إلى محفظة AQX";
  welcomeText.textContent="سعداء بعودتك. محفظتك وخدماتك في انتظارك، بتجربة سلسة وآمنة.";

  const s=await requestWithRetry("identity_session");
  if(s.setup_required){location.replace("setup.html");return;}
  if(!s.wallet_token)throw new Error("session_invalid");
  sessionStorage.setItem("aqx_wallet_access_token",s.wallet_token);
  location.replace("wallet.html");
 }catch(error){
  console.error("AQX wallet entry:",error?.data?.error||error?.message||"unknown");
  returnToDashboard();
 }
}
init();
</script>
</body></html>
