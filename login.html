<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store">
<title>الدخول إلى محفظة AQX</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1d2940,#080b12 58%);color:#f5f1e8;font-family:Cairo,Arial,sans-serif;display:grid;place-items:center;padding:22px}.panel{width:min(100%,440px);background:#111824;border:1px solid #b99548;border-radius:22px;padding:30px;box-shadow:0 24px 80px #0009}.brand{text-align:center;color:#d8b65f;font-weight:800}.lock{text-align:center;font-size:38px;margin:15px}h2{text-align:center}label{display:block;margin:18px 0 7px}input{width:100%;padding:14px;border-radius:11px;border:1px solid #35445a;background:#080e17;color:white;font:inherit}button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:18px;background:linear-gradient(120deg,#c29a43,#f0d77e);color:#16120a;font:800 15px Cairo}button:disabled{opacity:.5}.challenge{padding:12px;border:1px dashed #9f8547;border-radius:10px;text-align:center;color:#f0d77e}.msg{margin-top:14px;text-align:center;color:#f0c4a8;font-size:13px;line-height:1.8}.hp{position:absolute;left:-10000px}
</style></head>
<body><main class="panel">
<div class="brand">AQX UNIVERSAL WALLET</div><div class="lock">🔐</div><h2>الدخول إلى محفظتك</h2>
<p style="text-align:center;color:#b8c0cb;font-size:13px">استخدم كلمة مرور المحفظة المستقلة عن حساب AQX.</p>
<form id="form" autocomplete="off">
<label for="password">كلمة مرور المحفظة</label><input id="password" type="password" autocomplete="current-password" required>
<label>تحقق البوتات</label><div class="challenge" id="question">جارٍ تجهيز التحقق…</div>
<input id="answer" inputmode="numeric" placeholder="اكتب ناتج العملية" required>
<input class="hp" id="website" tabindex="-1" autocomplete="off">
<button id="submit" type="submit">دخول آمن</button><div class="msg" id="message" role="status"></div>
</form></main>
<script src="wallet-security.js"></script>
<script>
let challengeToken="",started=Date.now();const $=id=>document.getElementById(id);
async function init(){
 try{const p=await aqxWalletApi("profile");if(!p.wallet_exists)throw new Error("wallet_unavailable");if(!p.email_verified)throw new Error("email_not_verified");if(!p.phone_verified)throw new Error("phone_not_verified");if(!p.password_set){location.replace("setup.html");return}challengeToken=await aqxNewChallenge($("question"))}
 catch(e){$("message").textContent=aqxWalletError(e.data?.error||e.message);$("submit").disabled=true}
}
$("form").addEventListener("submit",async e=>{
 e.preventDefault();$("submit").disabled=true;$("message").textContent="جارٍ التحقق من بيانات الدخول…";
 try{
  const r=await aqxWalletApi("login",{password:$("password").value,challenge_token:challengeToken,challenge_answer:$("answer").value,honeypot:$("website").value,elapsed_ms:Date.now()-started});
  sessionStorage.setItem("aqx_wallet_access_token",r.wallet_token);location.replace("wallet.html");
 }catch(err){$("message").textContent=aqxWalletError(err.data?.error||err.message);try{challengeToken=await aqxNewChallenge($("question"));$("answer").value="";$("password").value="";started=Date.now()}catch{}}
 finally{$("submit").disabled=false}
});init();
</script></body></html>
