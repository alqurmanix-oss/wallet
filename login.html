<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store">
<title>الدخول إلى محفظة AQX</title>
<style>
*{box-sizing:border-box}
html{width:100%;max-width:100%;min-height:100%;overflow-x:hidden;overflow-anchor:none;scroll-behavior:auto}
body{display:block;position:relative;margin:0;width:100%;max-width:100%;min-height:100vh;min-height:100svh;background:#080b12;color:#f5f1e8;font-family:Tahoma,Arial,sans-serif;padding:max(24px,calc(env(safe-area-inset-top) + 20px)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow-x:hidden;overscroll-behavior:none;overflow-anchor:none}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 0,#1d2940,#080b12 58%)}
.panel{display:block;width:100%;max-width:440px;min-width:0;margin:0 auto;background:#111824;border:1px solid #b99548;border-radius:22px;padding:clamp(20px,5vw,30px);box-shadow:0 24px 80px #0009;overflow-anchor:none}
.brand{text-align:center;color:#d8b65f;font-weight:800}.lock{text-align:center;font-size:38px;margin:15px}h2{text-align:center}label{display:block;margin:18px 0 7px}
input{display:block;width:100%;min-width:0;padding:14px;border-radius:11px;border:1px solid #35445a;background:#080e17;color:white;font:inherit;font-size:16px}
button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:18px;background:linear-gradient(120deg,#c29a43,#f0d77e);color:#16120a;font:800 15px Tahoma,Arial,sans-serif;touch-action:manipulation}
button:disabled{opacity:.5}.msg{min-height:48px;margin-top:14px;text-align:center;color:#f0c4a8;font-size:13px;line-height:1.8}.hp{position:fixed!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important;left:0!important;top:0!important}
</style></head>
<body><main class="panel">
<div class="brand">AQX UNIVERSAL WALLET</div><div class="lock">🔐</div><h2>الدخول إلى محفظتك</h2>
<p style="text-align:center;color:#b8c0cb;font-size:13px">استخدم كلمة مرور المحفظة المستقلة عن حساب AQX.</p>
<form id="form" autocomplete="off">
<label for="password">كلمة مرور المحفظة</label><input id="password" type="password" autocomplete="current-password" required>
<input class="hp" id="website" tabindex="-1" autocomplete="off">
<button id="submit" type="submit">دخول آمن</button><div class="msg" id="message" role="status"></div>
</form></main>
<script src="wallet-security.js"></script>
<script>
const $=id=>document.getElementById(id);
async function init(){
 try{const p=await aqxWalletApi("profile");if(!p.wallet_exists)throw new Error("wallet_unavailable");if(!p.email_verified)throw new Error("email_not_verified");if(!p.phone_verified)throw new Error("phone_not_verified");if(!p.password_set){location.replace("setup.html");return}}
 catch(e){$("message").textContent=aqxWalletError(e.data?.error||e.message);$("submit").disabled=true}
}
$("form").addEventListener("submit",async e=>{
 e.preventDefault();$("submit").disabled=true;$("message").textContent="جارٍ التحقق من بيانات الدخول…";
 try{
  const r=await aqxWalletApi("login",{password:$("password").value,honeypot:$("website").value});
  sessionStorage.setItem("aqx_wallet_access_token",r.wallet_token);location.replace("wallet.html");
 }catch(err){$("message").textContent=aqxWalletError(err.data?.error||err.message);$("password").value=""}
 finally{$("submit").disabled=false}
});init();
</script></body></html>
