<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store">
<title>محفظة AQX</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b12;color:#f5f1e8;font-family:Cairo,Arial}.box{padding:30px;border:1px solid #b99548;border-radius:20px;background:#111824;text-align:center;max-width:440px;margin:20px}.muted{color:#b8c0cb;font-size:14px}button{border:0;border-radius:10px;padding:12px 25px;background:#d8b65f;font:700 14px Cairo}</style></head>
<body><main class="box"><div style="font-size:40px">◈</div><h2>محفظة AQX الموحدة</h2><p id="status" class="muted">جارٍ التحقق من جلسة المحفظة…</p><p class="muted">تم تأمين بوابة الدخول. واجهة الرصيد والحركات والتحويلات ستُربط في مرحلة بناء لوحة المحفظة.</p><button id="exit">خروج آمن</button></main>
<script src="wallet-security.js"></script><script>
const token=sessionStorage.getItem("aqx_wallet_access_token");const statusEl=document.getElementById("status");
if(!token){location.replace("login.html")}else{
 aqxWalletApi("validate_session",{},token).then(()=>{statusEl.textContent="تم التحقق من جلسة المحفظة بنجاح."}).catch(()=>{sessionStorage.removeItem("aqx_wallet_access_token");location.replace("login.html")});
}
document.getElementById("exit").onclick=async()=>{try{await aqxWalletApi("logout",{},token)}catch{}sessionStorage.removeItem("aqx_wallet_access_token");location.replace("login.html")};
</script></body></html>
